name: Record production acceptance evidence

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Catalogue application whose production acceptance passed
        required: true
        type: choice
        options:
          - memos
          - umami
      hostname:
        description: Exact generated SproutOS hostname exercised by the acceptance run
        required: true
        type: string
      evidence_base64:
        description: Base64-encoded sanitized production acceptance JSON
        required: true
        type: string
      evidence_sha256:
        description: SHA-256 digest of the decoded evidence JSON
        required: true
        type: string

concurrency:
  group: production-acceptance-evidence-${{ inputs.app_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    name: Verify and record ${{ inputs.app_id }} production acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ID: ${{ inputs.app_id }}
      EVIDENCE_BASE64: ${{ inputs.evidence_base64 }}
      EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
      HOSTNAME: ${{ inputs.hostname }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate bound evidence and live hostname
        shell: bash
        run: |
          set -euo pipefail

          [[ "$EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Evidence digest must be a lowercase SHA-256 digest."
            exit 1
          }
          [[ "$HOSTNAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.sproutos\.run$ ]] || {
            echo "::error::Hostname must be one generated SproutOS application hostname."
            exit 1
          }

          printf '%s' "$EVIDENCE_BASE64" | base64 --decode > production-acceptance.json
          printf '%s  %s\n' "$EVIDENCE_SHA256" production-acceptance.json | sha256sum --check --strict

          upstream_commit=$(jq -er --arg app "$APP_ID" '.[$app].commit' tests/upstream-lock.json)
          jq -e \
            --arg app "$APP_ID" \
            --arg hostname "$HOSTNAME" \
            --arg upstream_commit "$upstream_commit" '
              type == "object" and
              keys == [
                "app_id",
                "checks",
                "deployment_runs",
                "hostname",
                "passed",
                "plugin_digest",
                "project",
                "schema_version",
                "tested_at",
                "upstream_commit"
              ] and
              .schema_version == 1 and
              .app_id == $app and
              .hostname == $hostname and
              .upstream_commit == $upstream_commit and
              .passed == true and
              (.plugin_digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
              (.tested_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
              (.project | type == "object" and
                (.repository | type == "string" and test("^TestSproutOS/[A-Za-z0-9._-]+$")) and
                (.id | type == "string" and length > 0)) and
              (.checks | type == "array" and length > 0 and
                all(.[]; type == "object" and .passed == true and
                  (.name | type == "string" and length > 0))) and
              (.deployment_runs | type == "array" and length >= 2 and
                all(.[]; type == "object" and .conclusion == "success" and
                  (.url | type == "string" and
                    test("^https://github.com/TestSproutOS/[A-Za-z0-9._-]+/actions/runs/[0-9]+$"))))
            ' production-acceptance.json >/dev/null

          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${HOSTNAME}/" >/dev/null
          if [ "$APP_ID" = memos ]; then
            curl --fail --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "https://${HOSTNAME}/healthz" >/dev/null
          fi

      # v4.6.2
      - name: Preserve the exact verified evidence bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-acceptance-${{ inputs.app_id }}-${{ github.run_id }}
          path: production-acceptance.json
          if-no-files-found: error
          retention-days: 90

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # v7.0.1; full SHA is the only immutable action reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Shell syntax
        run: bash -n artifacts/*/*.sh scripts/ci/*.sh scripts/oci/*.sh plugins/*/tests/*.sh
      - name: Shell lint
        run: shellcheck artifacts/*/*.sh scripts/ci/*.sh scripts/oci/*.sh plugins/*/tests/*.sh
      - name: Immutable release recovery
        run: |
          scripts/oci/test-publish-immutable-release.sh
          artifacts/isolation-probes/test-validate-subjects.sh
      - name: Validate repository and generated workflows
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml plugins/*/assets/*.yml
      - name: No mutable action references
        run: |
          set -euo pipefail
          while IFS= read -r use; do
            ref="${use##*@}"
            ref="${ref%%[[:space:]]*}"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]] || [[ "$ref" = 0000000000000000000000000000000000000000 ]]; then
              echo "External action is not pinned to a full commit SHA: $use" >&2
              exit 1
            fi
          done < <(
            grep -RhE \
              '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+[^./][^[:space:]]+@' \
              .github/workflows plugins/*/assets/*.yml
          )
      - name: Isolation probe stays outside the catalogue
        run: |
          set -euo pipefail
          for directory in apps plugins catalogue goldens tests/fixtures; do
            [[ -d "$directory" ]] || continue
            if grep -RInE 'isolation-proof|isolation-probes' "$directory"; then
              echo "Isolation proofs must never enter catalogue inputs or goldens." >&2
              exit 1
            fi
          done

  oci-assembly-smoke:
    name: Offline OCI assembly smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v1; the action and installed ORAS release are both pinned.
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.0
      - run: scripts/oci/smoke-test.sh

  isolation-proof-matrix:
    name: Isolation proof matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(artifacts/isolation-probes/discover-matrix.sh)" >>"$GITHUB_OUTPUT"

  isolation-proof-native:
    name: Isolation proof ${{ matrix.kind }} (${{ matrix.target }})
    needs: isolation-proof-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.isolation-proof-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup target add "$BUILD_TARGET"
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Reproduce production bytes
        shell: bash
        run: >-
          artifacts/isolation-probes/build.sh
          "$PROOF_KIND" "$BUILD_TARGET" "$BUILD_OS" "$BUILD_ARCH"
          "$EXECUTABLE_SUFFIX" dist/isolation-probes
        env:
          PROOF_KIND: ${{ matrix.kind }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_OS: ${{ matrix.os }}
          BUILD_ARCH: ${{ matrix.arch }}
          EXECUTABLE_SUFFIX: ${{ matrix.suffix }}
      - name: Run native smoke behavior
        shell: bash
        run: artifacts/isolation-probes/smoke.sh "$PROOF_KIND" "$BUILD_TARGET" "$EXECUTABLE_SUFFIX"
        env:
          PROOF_KIND: ${{ matrix.kind }}
          BUILD_TARGET: ${{ matrix.target }}
          EXECUTABLE_SUFFIX: ${{ matrix.suffix }}

  windows-reproducibility:
    name: Windows reproducibility (${{ matrix.id }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: memos
            package: sprout-template-memos
          - id: umami
            package: sprout-template-umami
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build twice in independent target directories and compare bytes
        shell: bash
        run: >-
          scripts/ci/build-plugin.sh
          "$PLUGIN_PACKAGE"
          "$PLUGIN_PACKAGE"
          "$PLUGIN_ID"
          x86_64-pc-windows-msvc
          windows
          amd64
          .exe
        env:
          PLUGIN_PACKAGE: ${{ matrix.package }}
          PLUGIN_ID: ${{ matrix.id }}

  memos-pinned-upstream:
    name: Memos pinned-upstream acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
      - name: Install the upstream-pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@11.0.1
          test "$(pnpm --version)" = 11.0.1
      - run: plugins/memos/tests/pinned-upstream.sh

  umami-pinned-upstream:
    name: Umami pinned-upstream acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install the upstream-pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = 11.21.0
      - run: plugins/umami/tests/pinned-upstream.sh

name: Deploy Memos to SproutOS

on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
      - name: Install the upstream-pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@11.0.1
          test "$(pnpm --version)" = 11.0.1
      - name: Build the static Linux ARM64 application and controlled migrator
        run: |
          sh sproutos/build.sh
          tar -czf .sproutos/memos-deploy.tar.gz .sproutos/dist .sproutos/migration
      - name: Upload the exact deploy outputs
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sproutos-memos-build
          path: .sproutos/memos-deploy.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the run-scoped build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .sproutos/handoff
          merge-multiple: true
      - name: Restore and validate the exact deploy outputs
        run: |
          tar -xzf .sproutos/handoff/memos-deploy.tar.gz
          test -x .sproutos/dist/memos
          test -x .sproutos/dist/bootstrap
          test -x .sproutos/migration/bootstrap
      - name: Deploy with GitHub OIDC
        uses: MySproutOS/sproutos-deploy-action@18b8eff90fec9ff847698d109eba56c17d8332bb
        with:
          preset: web
          directory: .sproutos/dist
          environment: production
          runtime: provided.al2023
          handler: bootstrap
          migration-directory: .sproutos/migration
          migration-handler: bootstrap

[package]
name = "catalogue-generator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
spdx = "0.13"
url = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "catalogue-generator"
path = "src/main.rs"
